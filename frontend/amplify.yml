version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  # Set these in Amplify Console → Environment variables:
  # NEXT_PUBLIC_API_URL=https://YOUR_API_DOMAIN/api
  # NEXT_PUBLIC_SITE_URL=https://YOUR_AMPLIFY_DOMAIN
